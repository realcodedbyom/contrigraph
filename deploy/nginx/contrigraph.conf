# Installed into /etc/nginx/conf.d/contrigraph.conf (http context).
# Requires the dsvv.live certificate to cover dsvv.live AND www.dsvv.live.
limit_req_zone $binary_remote_addr zone=contrigraph_auth:10m rate=5r/m;
map $uri $contrigraph_cache_policy {
    default "no-cache, max-age=0, must-revalidate";
    ~^/(contrigraph/)?_next/static/ "public, max-age=31536000, immutable";
    ~^/(contrigraph/)?api/ "no-store";
}
server {
    listen 80;
    listen [::]:80;
    server_name dsvv.live www.dsvv.live;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /srv/contrigraph/acme; }
    location / { return 301 https://dsvv.live$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dsvv.live;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/dsvv.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsvv.live/privkey.pem;
    return 301 https://dsvv.live$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dsvv.live;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/dsvv.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsvv.live/privkey.pem;
    client_max_body_size 6m;
    error_page 413 = @contrigraph_body_too_large;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Nextjs-Prerender;
    proxy_hide_header X-Content-Type-Options;
    add_header Cache-Control $contrigraph_cache_policy always;
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://clerk.dsvv.live https://challenges.cloudflare.com https://*.protect.clerk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://img.clerk.com; connect-src 'self' https://clerk.dsvv.live https://clerk-telemetry.com https://*.clerk-telemetry.com https://*.protect.clerk.com:*; worker-src 'self' blob:; frame-src 'self' https://my.spline.design https://clerk.dsvv.live https://challenges.cloudflare.com https://*.protect.clerk.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location = / { return 204; }
    location = /robots.txt { alias /srv/contrigraph/robots.txt; }
    location = /sitemap.xml { alias /srv/contrigraph/sitemap.xml; }
    location = /favicon.svg { alias /srv/contrigraph/favicon.svg; }
    location = /llms.txt { alias /srv/contrigraph/llms.txt; }
    location = /llms-full.txt { alias /srv/contrigraph/llms-full.txt; }
    location = /contrigraph { return 301 /contrigraph/; }
    location ~* ^/contrigraph/login/?$ { return 302 /contrigraph/app/; }
    location ~* ^/contrigraph/signup/?$ { return 302 /contrigraph/app/?signup=1; }

    location ~ ^/(contrigraph/)?api/auth/(login|register|resend|callback|sandbox)/?$ {
        client_max_body_size 16k;
        limit_req zone=contrigraph_auth burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @contrigraph_throttled;
        error_page 413 = @contrigraph_body_too_large;
        rewrite ^/(contrigraph/)?api/(.*)$ /$2 break;
        proxy_pass http://127.0.0.1:8000;
    }
    location @contrigraph_throttled {
        default_type application/json;
        return 429 '{"detail":"Too many attempts. Wait one minute before retrying."}';
    }
    location @contrigraph_body_too_large {
        default_type application/json;
        return 413 '{"detail":"Request too large."}';
    }
    location /api/ { proxy_pass http://127.0.0.1:8000/; }
    location /contrigraph/api/ { proxy_pass http://127.0.0.1:8000/; }
    location /contrigraph/ { proxy_pass http://127.0.0.1:3000; }
    location /_next/ { proxy_pass http://127.0.0.1:3000/contrigraph/_next/; }
    location / { return 404; }
}
